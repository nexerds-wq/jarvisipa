name: AURAStandalone
options:
  bundleIdPrefix: com.nexerds
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  AURAStandalone:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JARVIS AURA
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "JARVIS AURA listens when you tap the microphone to talk."
        NSSpeechRecognitionUsageDescription: "JARVIS AURA transcribes your speech locally on the iPhone."
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexer.solosjarvisbg
        PRODUCT_NAME: AURAStandalone
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Manual
