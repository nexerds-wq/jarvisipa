name: AURAStandalone
options:
  bundleIdPrefix: com.nexerds
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  AURAStandalone:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JARVIS AURA
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "When hands-free is on, JARVIS AURA uses your iPhone microphone to listen for Hey Jarvis and follow-up questions."
        NSSpeechRecognitionUsageDescription: "JARVIS AURA recognizes your wake word and conversation using on-device speech recognition."
        NSLocationWhenInUseUsageDescription: "Only when you turn on nearby alerts, AURA uses approximate location for local weather warnings, rain forecasts and regional emergency news."
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexer.solosjarvisbg
        PRODUCT_NAME: AURAStandalone
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Manual
