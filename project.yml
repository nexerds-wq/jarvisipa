name: JarvisGlasses
options:
  bundleIdPrefix: com.nexer
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.nexer.jarvisglasses
    MARKETING_VERSION: 2.0
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
targets:
  JarvisGlasses:
    type: application
    platform: iOS
    sources:
      - path: JarvisGlasses
    settings:
      base:
        INFOPLIST_FILE: JarvisGlasses/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
