name: JarvisBlack
options:
  bundleIdPrefix: com.nexer
  deploymentTarget:
    iOS: "17.0"
targets:
  JarvisBlack:
    type: application
    platform: iOS
    sources:
      - path: JarvisBlack
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift
        product: MLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexer.solosjarvisbg
        MARKETING_VERSION: "26.0"
        CURRENT_PROJECT_VERSION: "28"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: JarvisBlack/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    entitlements:
      path: JarvisBlack/JarvisBlack.entitlements
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.32.3
