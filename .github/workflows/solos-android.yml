name: Build Solos Android HUD APK
on:
  push:
    branches: [solos-android-hud]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p SolosAndroid :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SolosLegacyHUD-Android-APK
          path: SolosAndroid/app/build/outputs/apk/debug/app-debug.apk
