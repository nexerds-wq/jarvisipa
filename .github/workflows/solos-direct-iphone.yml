name: Build Solos Direct iPhone IPA
on:
  push:
    branches: [solos-iphone-direct-ai, solos-iphone-v4-stable-flip, solos-iphone-v6-stable-features, solos-iphone-v7-orientation-dashboard, solos-iphone-v8-handsfree, solos-iphone-v9-voice-navigation, solos-iphone-v10-background-voice, solos-iphone-v11-spoken-screen-answers, solos-iphone-v12-jarvis-hud, solos-iphone-v13-lock-bargein, solos-iphone-v14-speech-pause-background, solos-iphone-v15-lockscreen-stability, solos-iphone-v16-ai-recovery, solos-iphone-v17-reliable-answers, solos-iphone-v18-auto-rearm-wake, solos-iphone-v19-live-clock-date, solos-iphone-v20-hex-learning, solos-iphone-v21-captions-translation-messages, solos-iphone-v22-voice-message-control-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 for iOS Foundation Models
        run: |
          if [ -d /Applications/Xcode_26.3.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          else
            echo "Xcode 26.3 not installed; using runner default"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate Xcode project
        working-directory: SolosDirectiOS
        run: xcodegen generate
      - name: Verify live phone clock and date intent routing
        working-directory: SolosDirectiOS
        run: |
          xcrun swiftc -parse-as-library Sources/JarvisLiveClock.swift Tests/LiveClockSmoke.swift -o /tmp/solos-live-clock-tests
          /tmp/solos-live-clock-tests
      - name: Build unsigned iOS app
        working-directory: SolosDirectiOS
        run: |
          xcodebuild -project SolosDirect.xcodeproj -scheme SolosDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          set -e
          mkdir -p ipa/Payload
          ditto SolosDirectiOS/build/Build/Products/Release-iphoneos/SolosDirect.app ipa/Payload/SolosDirect.app
          (cd ipa && zip -qry ../SolosDirect-iPhone-unsigned.ipa Payload)
          unzip -t SolosDirect-iPhone-unsigned.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SolosDirect-iPhone-IPA-unsigned
          path: SolosDirect-iPhone-unsigned.ipa
          if-no-files-found: error
