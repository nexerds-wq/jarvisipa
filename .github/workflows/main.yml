name: Jarvis Fast IPA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out Solos HUD
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Flutter dependencies
        working-directory: solos_hud
        run: flutter pub get

      - name: Check and apply speed fixes
        run: |
          python3 apply_fast_fix.py --check
          python3 apply_fast_fix.py --apply

      - name: Build release iOS app without signing
        working-directory: solos_hud
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: solos_hud
        run: |
          set -euo pipefail
          test -f build/ios/iphoneos/Runner.app/Info.plist
          test -f build/ios/iphoneos/Runner.app/Runner
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && ditto -c -k --sequesterRsrc --keepParent Payload Jarvis-Fast-unsigned.ipa)
          unzip -t ipa/Jarvis-Fast-unsigned.ipa | tail -n 3

      - name: Attach IPA file
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Fast-unsigned-IPA
          path: solos_hud/ipa/Jarvis-Fast-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
