name: Build Jarvis unsigned IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Solos Jarvis project
        working-directory: SolosDirectiOS
        run: xcodegen generate --spec project.yml
      - name: Check offline voice-command behavior
        working-directory: SolosDirectiOS
        run: |
          set -euo pipefail
          swiftc Sources/JarvisSystemCommands.swift Tests/JarvisSystemCommandSmoke.swift -o "$RUNNER_TEMP/jarvis-system-test"
          "$RUNNER_TEMP/jarvis-system-test"
          swiftc Sources/JarvisWakePhrase.swift Tests/JarvisWakePhraseSmoke.swift -o "$RUNNER_TEMP/jarvis-wake-test"
          "$RUNNER_TEMP/jarvis-wake-test"
          swiftc Sources/JarvisSpeechEndpoint.swift Tests/JarvisSpeechEndpointSmoke.swift -o "$RUNNER_TEMP/jarvis-endpoint-test"
          "$RUNNER_TEMP/jarvis-endpoint-test"
          swiftc Sources/JarvisSpeechPerformance.swift Tests/JarvisSpeechPerformanceSmoke.swift -o "$RUNNER_TEMP/jarvis-performance-test"
          "$RUNNER_TEMP/jarvis-performance-test"
          swiftc Sources/JarvisMusicCommands.swift Tests/MusicCommandSmoke.swift -o "$RUNNER_TEMP/jarvis-music-test"
          "$RUNNER_TEMP/jarvis-music-test"
          swiftc Sources/JarvisLiveClock.swift Tests/LiveClockSmoke.swift -o "$RUNNER_TEMP/jarvis-clock-test"
          "$RUNNER_TEMP/jarvis-clock-test"
          swiftc Sources/JarvisSongCatalog.swift Tests/JarvisSongCatalogSmoke.swift -o "$RUNNER_TEMP/jarvis-catalog-test"
          "$RUNNER_TEMP/jarvis-catalog-test"
      - name: Compile without signing
        working-directory: SolosDirectiOS
        run: |
          set -euo pipefail
          xcodebuild -project SolosDirect.xcodeproj -scheme SolosDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/jarvis-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=31 build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/jarvis-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          zip -qry Jarvis_Update_Unsigned.ipa Payload
          unzip -t Jarvis_Update_Unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis_Update_Unsigned_IPA
          path: Jarvis_Update_Unsigned.ipa
          if-no-files-found: error
