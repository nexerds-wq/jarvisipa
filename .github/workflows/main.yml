name: Build Solos HUD iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build iOS on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out Solos HUD source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show build tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Get Flutter packages
        working-directory: solos_hud
        run: flutter pub get

      - name: Add missing iOS speech permission descriptions
        working-directory: solos_hud
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Solos HUD uses your microphone when you use voice commands." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Solos HUD uses speech recognition when you use voice commands." ios/Runner/Info.plist
          plutil -lint ios/Runner/Info.plist

      - name: Compile the actual iPhone app (no signing)
        working-directory: solos_hud
        run: flutter build ios --release --no-codesign

      - name: Package the built Runner.app into an IPA
        run: |
          set -euo pipefail
          test -d solos_hud/build/ios/iphoneos/Runner.app
          mkdir -p "$RUNNER_TEMP/solos-ipa/Payload"
          ditto solos_hud/build/ios/iphoneos/Runner.app "$RUNNER_TEMP/solos-ipa/Payload/Runner.app"
          (cd "$RUNNER_TEMP/solos-ipa" && zip -qry "$GITHUB_WORKSPACE/SolosHUD-unsigned.ipa" Payload)
          unzip -t SolosHUD-unsigned.ipa >/dev/null
          ls -lh SolosHUD-unsigned.ipa

      - name: Upload downloadable unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SolosHUD-iOS-unsigned
          path: SolosHUD-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
