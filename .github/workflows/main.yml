name: Build Jarvis Solos HUD IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SolosDirectiOS/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-hud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build original Solos HUD iPhone app
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.3.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi

      - name: Generate Solos HUD Xcode project
        working-directory: SolosDirectiOS
        run: xcodegen generate

      - name: Verify time and date
        working-directory: SolosDirectiOS
        run: |
          xcrun swiftc -parse-as-library Sources/JarvisLiveClock.swift Tests/LiveClockSmoke.swift -o /tmp/solos-clock-test
          /tmp/solos-clock-test

      - name: Verify Apple Music voice commands
        working-directory: SolosDirectiOS
        run: |
          xcrun swiftc -parse-as-library Sources/JarvisMusicCommands.swift Tests/MusicCommandSmoke.swift -o /tmp/jarvis-music-tests
          /tmp/jarvis-music-tests

      - name: Verify public catalog matching
        working-directory: SolosDirectiOS
        run: |
          xcrun swiftc -parse-as-library Sources/JarvisSongCatalog.swift Tests/JarvisSongCatalogSmoke.swift -o /tmp/jarvis-catalog-tests
          /tmp/jarvis-catalog-tests

      - name: Verify Jarvis stop, quit, standby and wake voice commands
        working-directory: SolosDirectiOS
        run: |
          xcrun swiftc -parse-as-library Sources/JarvisSystemCommands.swift Tests/JarvisSystemCommandSmoke.swift -o /tmp/jarvis-system-tests
          /tmp/jarvis-system-tests

      - name: Build iPhone app (unsigned)
        working-directory: SolosDirectiOS
        run: |
          set -o pipefail
          xcodebuild -project SolosDirect.xcodeproj -scheme SolosDirect \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=SolosDirectiOS/build/Build/Products/Release-iphoneos/SolosDirect.app
          test -f "$APP/Info.plist"
          test -f "$APP/SolosDirect"
          mkdir -p ipa/Payload
          ditto "$APP" ipa/Payload/SolosDirect.app
          (cd ipa && zip -qry ../Jarvis-Solos-HUD-V25-unsigned.ipa Payload)
          unzip -t Jarvis-Solos-HUD-V25-unsigned.ipa >/dev/null

      - name: Upload downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Solos-HUD-V25-unsigned-IPA
          path: Jarvis-Solos-HUD-V25-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
