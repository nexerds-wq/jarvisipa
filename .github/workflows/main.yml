name: Build Jarvis Glasses IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "JarvisGlasses/**"
      - "project.yml"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out Jarvis source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iPhone (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project JarvisGlasses.xcodeproj \
            -scheme JarvisGlasses \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/jarvis-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/jarvis-derived/Build/Products/Release-iphoneos/JarvisGlasses.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/JarvisGlasses"
          plutil -lint "$APP/Info.plist"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/JarvisGlasses.app
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Payload JarvisGlasses-unsigned.ipa)
          unzip -t dist/JarvisGlasses-unsigned.ipa | tail -n 3

      - name: Upload IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: JarvisGlasses-unsigned-IPA
          path: dist/JarvisGlasses-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
