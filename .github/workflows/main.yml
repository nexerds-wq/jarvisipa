name: Build Jarvis Solos HUD IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "solos_hud/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build iPhone app
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: solos_hud
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show build tools
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Runner"
          plutil -lint "$APP/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (
            cd ipa
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Jarvis-Solos-HUD-unsigned.ipa
          )
          unzip -t ipa/Jarvis-Solos-HUD-unsigned.ipa | tail -n 3

      - name: Upload downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Solos-HUD-unsigned-IPA
          path: solos_hud/ipa/Jarvis-Solos-HUD-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
