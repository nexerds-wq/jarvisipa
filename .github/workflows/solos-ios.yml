name: Build Original Solos HUD iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Download original Solos HUD source
        uses: actions/checkout@v4
        with:
          repository: StudentBroken/solos-hud
          path: upstream
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: upstream/solos_hud
        run: flutter pub get
      - name: Add iOS microphone and speech recognition permissions
        working-directory: upstream/solos_hud
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          with p.open("rb") as f:
              data = plistlib.load(f)
          data["NSMicrophoneUsageDescription"] = "Solos HUD uses the microphone for voice commands."
          data["NSSpeechRecognitionUsageDescription"] = "Solos HUD uses speech recognition to understand voice commands."
          with p.open("wb") as f:
              plistlib.dump(data, f)
          PY
      - name: Build unsigned iOS app
        working-directory: upstream/solos_hud
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        working-directory: upstream/solos_hud
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SolosHUD-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SolosHUD-unsigned-IPA
          path: upstream/solos_hud/SolosHUD-unsigned.ipa
