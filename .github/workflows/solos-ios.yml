name: Build Original Solos HUD iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Download original Solos HUD source
        uses: actions/checkout@v4
        with:
          repository: StudentBroken/solos-hud
          path: upstream
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: upstream/solos_hud
        run: flutter pub get
      - name: Build unsigned iOS app
        working-directory: upstream/solos_hud
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        working-directory: upstream/solos_hud
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SolosHUD-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SolosHUD-unsigned-IPA
          path: upstream/solos_hud/SolosHUD-unsigned.ipa
