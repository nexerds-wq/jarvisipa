name: Test Jarvis iOS launch
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  launch:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate app project
        working-directory: SolosDirectiOS
        run: xcodegen generate --spec project.yml
      - name: Inspect simulator availability
        run: xcrun simctl list devices available
      - name: Build for the simulator
        working-directory: SolosDirectiOS
        run: |
          set -euo pipefail
          xcodebuild -project SolosDirect.xcodeproj -scheme SolosDirect -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/jarvis-sim" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Launch and verify the app remains alive
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); matches=[x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable",False) and "iPhone" in x.get("name","")]; print(matches[0] if matches else "")')
          test -n "$DEVICE" || { echo "No iPhone Simulator runtime available"; exit 1; }
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find "$RUNNER_TEMP/jarvis-sim/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.nexer.solosjarvisbg
          sleep 10
          echo "Checking running simulator processes..."
          xcrun simctl spawn "$DEVICE" /bin/ps -A -o pid,comm | tee "$RUNNER_TEMP/jarvis-sim-processes.txt"
          xcrun simctl spawn "$DEVICE" /bin/ps -A -o comm | grep -q 'SolosDirect' || { echo 'JARVIS EXITED AFTER LAUNCH'; exit 1; }
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/jarvis-launch.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis_Simulator_Launch_Diagnostics
          path: |
            ${{ runner.temp }}/jarvis-launch.png
            ${{ runner.temp }}/jarvis-sim-processes.txt
          if-no-files-found: ignore
